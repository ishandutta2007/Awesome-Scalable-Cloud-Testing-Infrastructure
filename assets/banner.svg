<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19;border-radius:16px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Badge / Card Gradients -->
    <linearGradient id="card-grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="card-grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="card-grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="line-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.4" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.2" />
    </pattern>

    <style>
      /* Dynamic Animated Elements in Background / Sides */
      @keyframes pulseLight {
        0%, 100% { transform: scale(1); opacity: 0.25; }
        50% { transform: scale(1.15); opacity: 0.45; }
      }
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1deg); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(8px) rotate(-1deg); }
      }
      @keyframes dashStream {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulseGlowRing {
        0% { r: 12px; opacity: 0.8; }
        100% { r: 28px; opacity: 0; }
      }

      .glow-orb1 {
        animation: pulseLight 8s ease-in-out infinite;
        transform-origin: 200px 80px;
      }
      .glow-orb2 {
        animation: pulseLight 10s ease-in-out infinite 2s;
        transform-origin: 1000px 280px;
      }
      .stream-line {
        stroke-dasharray: 20, 15;
        animation: dashStream 14s linear infinite;
      }
      .stream-fast {
        stroke-dasharray: 12, 10;
        animation: dashStream 8s linear infinite reverse;
      }
      .pill-float-1 {
        animation: floatSlow1 6s ease-in-out infinite;
      }
      .pill-float-2 {
        animation: floatSlow2 7s ease-in-out infinite 1s;
      }
      .pill-float-3 {
        animation: floatSlow1 6.5s ease-in-out infinite 2.5s;
      }
      .radar-arm {
        transform-origin: 1060px 100px;
        animation: radarSweep 12s linear infinite;
      }
      .pulse-ring {
        animation: pulseGlowRing 2.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Ambient Light Orbs (Background) -->
  <circle cx="200" cy="80" r="180" fill="#0284c7" filter="blur(60px)" class="glow-orb1" />
  <circle cx="1020" cy="260" r="200" fill="#7c3aed" filter="blur(70px)" class="glow-orb2" />
  <circle cx="600" cy="180" r="140" fill="#2563eb" filter="blur(65px)" opacity="0.15" />

  <!-- Dynamic Network / Flow Streams in Deep Background -->
  <g opacity="0.35">
    <path d="M -50 90 Q 300 20 600 90 T 1250 80" fill="none" stroke="#38bdf8" stroke-width="1.5" class="stream-line" />
    <path d="M -50 280 Q 300 320 600 270 T 1250 290" fill="none" stroke="#818cf8" stroke-width="1.5" class="stream-fast" />
    <path d="M 100 370 Q 400 150 750 360 T 1200 40" fill="none" stroke="#c084fc" stroke-width="1" stroke-dasharray="8, 12" opacity="0.4" />
  </g>

  <!-- Radar Node in Upper Right (Decorative Background) -->
  <g opacity="0.4">
    <circle cx="1060" cy="100" r="50" fill="none" stroke="#334155" stroke-width="1" />
    <circle cx="1060" cy="100" r="30" fill="none" stroke="#334155" stroke-width="1" />
    <circle cx="1060" cy="100" r="10" fill="#38bdf8" />
    <circle cx="1060" cy="100" r="12" fill="none" stroke="#38bdf8" class="pulse-ring" />
    <line x1="1060" y1="100" x2="1110" y2="100" stroke="#38bdf8" stroke-width="1.5" class="radar-arm" opacity="0.8" />
  </g>

  <!-- Animated Metric / Feature Pills (Positioned around borders to never obstruct central title) -->
  <g class="pill-float-1">
    <rect x="70" y="45" width="180" height="34" rx="17" fill="url(#card-grad1)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="88" cy="62" r="5" fill="#38bdf8" />
    <text x="103" y="67" fill="#e0f2fe" font-size="12" font-weight="600" letter-spacing="0.5">⚡ PARALLEL GRIDS</text>
  </g>

  <g class="pill-float-2">
    <rect x="940" y="45" width="190" height="34" rx="17" fill="url(#card-grad2)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="958" cy="62" r="5" fill="#818cf8" />
    <text x="973" y="67" fill="#e0e7ff" font-size="12" font-weight="600" letter-spacing="0.5">📱 REAL DEVICE CLOUD</text>
  </g>

  <g class="pill-float-3">
    <rect x="70" y="275" width="200" height="34" rx="17" fill="url(#card-grad2)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="88" cy="292" r="5" fill="#4ade80" />
    <text x="103" y="297" fill="#dcfce7" font-size="12" font-weight="600" letter-spacing="0.5">☸️ K8S TESTRUNNERS</text>
  </g>

  <g class="pill-float-1">
    <rect x="930" y="275" width="200" height="34" rx="17" fill="url(#card-grad3)" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="948" cy="292" r="5" fill="#c084fc" />
    <text x="963" y="297" fill="#f3e8ff" font-size="12" font-weight="600" letter-spacing="0.5">🤖 AI AGENTIC TESTING</text>
  </g>

  <!-- FOREGROUND: Main Title and Subtitle with High-Contrast Shielding -->
  <!-- Centered Divider Glow Line -->
  <line x1="250" y1="210" x2="950" y2="210" stroke="url(#line-glow)" stroke-width="2" />

  <!-- Pre-title Tag -->
  <g>
    <rect x="495" y="65" width="210" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="600" y="82" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">CURATED AWESOME DIRECTORY</text>
  </g>

  <!-- Main Headline (Crisp Foreground, 100% Legibility) -->
  <text x="600" y="148" fill="url(#title-grad)" font-size="38" font-weight="900" letter-spacing="-0.8" text-anchor="middle" filter="drop-shadow(0 4px 14px rgba(0,0,0,0.8))">
    Scalable Cloud Testing Infrastructure
  </text>

  <!-- Secondary Descriptive Subtitle -->
  <text x="600" y="188" fill="#cbd5e1" font-size="16" font-weight="400" letter-spacing="0.2" text-anchor="middle" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.9))">
    Enterprise SaaS Clouds, Distributed Selenium Grids, Real Device Farms &amp; K8s Test Orchestrators
  </text>

  <!-- Bottom Badges / Tech Row in Foreground -->
  <g transform="translate(365, 226)">
    <!-- Node: Selenium -->
    <rect x="0" y="0" width="85" height="22" rx="4" fill="#1e293b" opacity="0.9" stroke="#334155" stroke-width="0.8" />
    <text x="42.5" y="15" fill="#93c5fd" font-size="10" font-weight="600" text-anchor="middle">Selenium 4</text>

    <!-- Node: Playwright -->
    <rect x="95" y="0" width="85" height="22" rx="4" fill="#1e293b" opacity="0.9" stroke="#334155" stroke-width="0.8" />
    <text x="137.5" y="15" fill="#93c5fd" font-size="10" font-weight="600" text-anchor="middle">Playwright</text>

    <!-- Node: Appium -->
    <rect x="190" y="0" width="85" height="22" rx="4" fill="#1e293b" opacity="0.9" stroke="#334155" stroke-width="0.8" />
    <text x="232.5" y="15" fill="#a5b4fc" font-size="10" font-weight="600" text-anchor="middle">Appium 2</text>

    <!-- Node: Testkube -->
    <rect x="285" y="0" width="85" height="22" rx="4" fill="#1e293b" opacity="0.9" stroke="#334155" stroke-width="0.8" />
    <text x="327.5" y="15" fill="#a5b4fc" font-size="10" font-weight="600" text-anchor="middle">Testkube</text>

    <!-- Node: Grafana k6 -->
    <rect x="380" y="0" width="90" height="22" rx="4" fill="#1e293b" opacity="0.9" stroke="#334155" stroke-width="0.8" />
    <text x="425" y="15" fill="#d8b4fe" font-size="10" font-weight="600" text-anchor="middle">Grafana k6</text>
  </g>
</svg>
